name: Import skill archive

on:
  push:
    branches:
      - main
    paths:
      - all-skills-20261116.zip
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install catalog parser
        run: python -m pip install PyYAML

      - name: Safely unpack archive
        run: python scripts/import_archive.py

      - name: Build description catalog and manifest
        run: python scripts/build_catalog.py

      - name: Commit imported library
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Import skills and rebuild catalog"
          git push
