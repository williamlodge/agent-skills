name: Import skill archive

on:
  push:
    branches:
      - main
    paths:
      - "inbox/*.zip"
      - "all-skills-20261116.zip"
      - "scripts/*.py"
      - "docs/catalog.template.html"
      - "README.template.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install catalog parser
        run: python -m pip install PyYAML

      - name: Safely merge waiting archives
        run: python scripts/import_archive.py

      - name: Build description catalog, public page, and manifest
        run: python scripts/build_catalog.py

      - name: Commit imported library
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Import skills and rebuild public catalog"
          git push
